<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Blog multi-role</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <header class="site-header">
        <div class="brand">Blog Multi-Role</div>
        <nav>
            <button id="articlesBtn">Articles</button>
            <button id="loginBtn">Connexion</button>
            <button id="registerBtn">Inscription</button>
            <button id="publishBtn">Publier</button>
            <button id="authorBtn">Mes articles</button>
            <button id="logoutBtn" class="hidden">Deconnexion</button>
        </nav>
    </header>

    <main class="page-content auth-page">
        <section class="panel auth-panel">
            <h1>Connexion</h1>
            <form id="loginForm" method="post" action="">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>

                <label for="password">Mot de passe</label>
                <input type="password" id="password" name="password" required>

                <button type="submit">Se connecter</button>
            </form>

            <p>Pas encore inscrit ? <a href="register.html">Créer un compte</a></p>
            <p><a href="index.html">Retour au blog</a></p>
            <div id="alert" class="alert hidden"></div>
        </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
