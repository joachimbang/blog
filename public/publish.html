<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Publier un article - Blog multi-role</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/publish.css">
</head>
<body>
    <header class="site-header">
        <div class="brand">Blog Multi-Role</div>
        <nav>
            <button id="articlesBtn">Articles</button>
            <button id="loginBtn">Connexion</button>
            <button id="registerBtn">Inscription</button>
            <button id="publishBtn">Publier</button>
            <button id="authorBtn">Mes articles</button>
            <button id="logoutBtn" class="hidden">Deconnexion</button>
        </nav>
    </header>

    <main class="page-content">
        <section class="panel publish-panel">
            <h1>Publier un article</h1>
            <p>Seuls les comptes <strong>auteur</strong> ou <strong>admin</strong> peuvent publier un nouvel article.</p>
            <div id="alert" class="alert hidden"></div>
            <form id="publishForm">
                <label for="titre">Titre</label>
                <input type="text" id="titre" name="titre" required>

                <label for="contenu">Contenu</label>
                <textarea id="contenu" name="contenu" rows="8" required></textarea>

                <button type="submit">Publier</button>
            </form>
            <p id="publishNotice" class="publish-notice"></p>
        </section>
    </main>

    <script src="js/common.js"></script>
    <script src="js/publish.js"></script>
</body>
</html>
